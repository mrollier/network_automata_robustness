[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llna"
version = "0.1.0"
description = "Life-Like Network Automata: robustness, defect propagation, and Lyapunov spectra of density-based binary automata on networks"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Michiel Rollier" },
    { name = "Lucas Caldeira" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "torch>=2.2",
    "igraph>=0.11",
    "h5py>=3.9",
    "matplotlib>=3.8",
    "tqdm",
    "cellpylib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff",
    "pre-commit",
    "nbformat",
    "nbconvert",
    "jupyter",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy", "archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
# E501: long docstrings/messages in research code moved verbatim
# E731: lambda-assignment is the established style in the encoding core
# NPY002: legacy global np.random calls are a pinned reproducibility contract
#         (see tests/characterization); new code should take an rng parameter
ignore = ["E501", "E731", "NPY002"]
