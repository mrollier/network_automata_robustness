# Cross-platform environment for the llna package.
#
#   conda env create -f environment.yml
#   conda activate llna
#
# The package itself (and its pip-only deps) installs editable via pip.
# The previous version of this file was a full `conda env export` from a
# Windows machine (build strings, C:\ prefix) and could not solve elsewhere.
name: llna
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - scipy>=1.12
  - pytorch>=2.2
  - python-igraph>=0.11
  - h5py>=3.9
  - matplotlib>=3.8
  - pandas>=2.2
  - tqdm
  - jupyter
  - pip:
      - -e .[dev]
